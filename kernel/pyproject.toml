[project]
name = "ui-agent"
version = "0.1.0"
description = "Natural-language UI test runner: LLM plans and escalates, TypeSafe Jev decides, Playwright executes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
ui-agent = "ui_agent.entry:main"

# MCP 适配器是可选薄壳：内核本身不依赖 mcp 包。
#   uv sync --extra mcp
#   uv run python -m ui_agent.mcp_server
[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ui_agent"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
