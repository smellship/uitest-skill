id: baiwang-bill-query
title: 百望电子票据平台-登录并查询
priority: P1
tags: [冒烟, 回归]
env: baiwang-prd

vars:
  账号: ${{secret.账号}}
  密码: ${{secret.密码}}

steps:
  - goal: 打开系统登录页，使用 账号 / 密码 登录，进入系统主页面
    checks:
      - element_exists: 查询
  - goal: 在查询条件中把行政区域选择为 2102 大连
    checks:
      # 这是个自定义下拉：选中后控件自身的标签就变成选中值（combobox 没有 value），
      # 所以按"标签里出现 2102 大连"验收，而不是 element_value。
      - element_exists: 2102 大连
  - goal: 点击查询，等待票据列表加载完成
    checks:
      # 表头没有"票据列表"这个词：用真实存在的列名 + 结果行内容验收
      - text_contains: 票据类型
      - text_contains: 缴款人
      - element_absent: 暂无数据
